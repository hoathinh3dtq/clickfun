[package]
name = "clickfun-app"
version = "0.1.0"
description = "ClickFun photo booth kiosk UI"
authors = ["ClickFun"]
edition = "2021"

[lib]
name = "clickfun_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
